# Releases the module. On each push to main of a single-module repository,
# the commits since the last tag give the version (Conventional Commits): a
# "!" or a BREAKING CHANGE footer a major release, a minor one before 1.0.0;
# feat a minor one; fix and perf a patch; any other type none. The run then
# dates the [Unreleased] section of the CHANGELOG, bumps the ?ref= of the
# README, commits "chore: release vX.Y.Z", tags it and creates the GitHub
# release, all in one run: a tag pushed with the GITHUB_TOKEN starts no other
# workflow. A tag pushed by hand, vX.Y.Z or <module>/vX.Y.Z in a
# monorepository, gets its release the same way; run it by hand for a tag
# pushed before this workflow.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*", "*/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, such as v1.2.0 or cloudflare-dns/v1.2.0
        required: true

permissions:
  contents: write

# Two runs at once would compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      # The whole history and its tags, and the token to push the release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref_type == 'branch' && github.event_name == 'push'
        with:
          fetch-depth: 0

      # A monorepository has one CHANGELOG per module: its tags stay manual.
      - name: Tag the version the commits call for
        id: tag
        if: github.ref_type == 'branch' && github.event_name == 'push'
        run: |
          if [ ! -f CHANGELOG.md ] || [ ! -f versions.tf ]; then
            echo "Not a single-module repository: nothing to tag"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          range=${last:+$last..}HEAD
          subjects=$(git log --no-merges --format=%s "$range")
          bodies=$(git log --no-merges --format=%b "$range")
          type='^[a-z]+(\([^)]*\))?'
          if grep -qE "$type!:" <<< "$subjects" || grep -qE '^BREAKING[ -]CHANGE:' <<< "$bodies"; then
            bump=major
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$subjects"; then
            bump=minor
          elif grep -qE '^(fix|perf)(\([^)]*\))?:' <<< "$subjects"; then
            bump=patch
          else
            echo "No feat, fix, perf or breaking change since ${last:-the first commit}: nothing to tag"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case $bump in
            major) if [ "$major" -eq 0 ]; then minor=$((minor + 1)) patch=0; else major=$((major + 1)) minor=0 patch=0; fi ;;
            minor) minor=$((minor + 1)) patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          tag="v$version"
          # The PRs write their changes under [Unreleased]: none is a forgotten CHANGELOG.
          unreleased=$(awk '/^## \[Unreleased\]/ { found = 1; next } found && (/^## \[/ || /^\[[^]]+\]: /) { exit } found { print }' CHANGELOG.md)
          if ! grep -q '[^[:space:]]' <<< "$unreleased"; then
            echo "::error::CHANGELOG.md has nothing under [Unreleased] for $tag"
            exit 1
          fi
          sed -i "0,/^## \[Unreleased\]\$/s//## [Unreleased]\n\n## [$version] - $(date -u +%F)/" CHANGELOG.md
          sed -i -E "s#^\[Unreleased\]: (.+)/compare/(.+)\.\.\.(.+)\$#[Unreleased]: \1/compare/$tag...\3\n[$version]: \1/compare/\2...$tag#" CHANGELOG.md
          # The examples of the README pin this module by its tag.
          if [ -n "$last" ]; then
            pin="${GH_REPO#*/}.git?ref="
            { git grep -lF "$pin$last\"" -- '*.md' || true; } | xargs -r sed -i "s/${pin//./\\.}${last//./\\.}\"/$pin$tag\"/g"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore: release $tag"
          git tag -a "$tag" -m "${GH_REPO#*/} $tag"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create the release from the CHANGELOG
        if: steps.tag.outputs.tag != '' || env.TAG != ''
        env:
          TAG: ${{ steps.tag.outputs.tag || env.TAG }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          version=${TAG##*v}
          module=${TAG%v"$version"}
          changelog="${module}CHANGELOG.md"
          gh api "repos/$GH_REPO/contents/$changelog?ref=$TAG" -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/CHANGELOG.md"
          # From "## [X.Y.Z]" to the next version or the link definitions.
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' "$RUNNER_TEMP/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::$changelog has no section for $version"
            exit 1
          fi
          name=${module%/}
          gh release create "$TAG" --verify-tag --title "${name:-${GH_REPO#*/}} v$version" --notes-file "$RUNNER_TEMP/notes.md"
